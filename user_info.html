<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Connection Info</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center font-sans antialiased text-gray-200 p-4">

    <div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-2xl">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">Connection Details</h1>
            <p class="text-gray-400 mt-2">Information provided by your browser and network</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- IP Address Card -->
            <div class="bg-gray-900 p-5 rounded-xl border border-gray-700">
                <span class="text-xs font-bold uppercase text-blue-400 tracking-wider">Public IP Address</span>
                <p id="ip-address" class="text-xl font-mono mt-2 text-white">Detecting...</p>
            </div>

            <!-- Client/Browser Card -->
            <div class="bg-gray-900 p-5 rounded-xl border border-gray-700">
                <span class="text-xs font-bold uppercase text-green-400 tracking-wider">Browser (Client)</span>
                <p id="browser-name" class="text-xl font-mono mt-2 text-white">Loading...</p>
            </div>

            <!-- OS Card -->
            <div class="bg-gray-900 p-5 rounded-xl border border-gray-700">
                <span class="text-xs font-bold uppercase text-purple-400 tracking-wider">Operating System</span>
                <p id="os-name" class="text-xl font-mono mt-2 text-white">Loading...</p>
            </div>

            <!-- Language Card -->
            <div class="bg-gray-900 p-5 rounded-xl border border-gray-700">
                <span class="text-xs font-bold uppercase text-yellow-400 tracking-wider">Preferred Language</span>
                <p id="user-lang" class="text-xl font-mono mt-2 text-white">Loading...</p>
            </div>
        </div>

        <!-- Detailed User Agent -->
        <div class="mt-6 bg-gray-900 p-5 rounded-xl border border-gray-700">
            <span class="text-xs font-bold uppercase text-red-400 tracking-wider">Full User Agent String</span>
            <p id="user-agent" class="text-sm font-mono mt-2 text-gray-300 break-all leading-relaxed"></p>
        </div>

        <footer class="mt-8 text-center">
            <a href="rgb_viewer.html" class="text-blue-400 hover:text-blue-300 transition-colors text-sm font-medium">
                &larr; Back to RGB Viewer
            </a>
        </footer>
    </div>

    <script>
        /**
         * Fetches the public IP address from a third-party service.
         */
        async function fetchIP() {
            const ipEl = document.getElementById('ip-address');
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                ipEl.textContent = data.ip;
            } catch (error) {
                ipEl.textContent = "Unavailable (Check ad-blocker)";
                ipEl.classList.add('text-red-400');
            }
        }

        /**
         * Detects basic browser and OS information using Navigator API.
         */
        function detectDetails() {
            const ua = navigator.userAgent;
            let browser = "Unknown";
            let os = "Unknown";

            // Simple Browser Detection
            if (ua.indexOf("Firefox") > -1) browser = "Mozilla Firefox";
            else if (ua.indexOf("SamsungBrowser") > -1) browser = "Samsung Internet";
            else if (ua.indexOf("Opera") > -1 || ua.indexOf("OPR") > -1) browser = "Opera";
            else if (ua.indexOf("Trident") > -1) browser = "Internet Explorer";
            else if (ua.indexOf("Edge") > -1 || ua.indexOf("Edg") > -1) browser = "Microsoft Edge";
            else if (ua.indexOf("Chrome") > -1) browser = "Google Chrome";
            else if (ua.indexOf("Safari") > -1) browser = "Apple Safari";

            // Simple OS Detection
            if (ua.indexOf("Win") > -1) os = "Windows";
            else if (ua.indexOf("Mac") > -1) os = "macOS";
            else if (ua.indexOf("X11") > -1 || ua.indexOf("Linux") > -1) os = "Linux";
            else if (ua.indexOf("Android") > -1) os = "Android";
            else if (ua.indexOf("Like Mac") > -1) os = "iOS";

            // Update UI
            document.getElementById('browser-name').textContent = browser;
            document.getElementById('os-name').textContent = os;
            document.getElementById('user-lang').textContent = navigator.language || "Not set";
            document.getElementById('user-agent').textContent = ua;
        }

        // Initialize on load
        window.onload = () => {
            fetchIP();
            detectDetails();
        };
    </script>
</body>
</html>
